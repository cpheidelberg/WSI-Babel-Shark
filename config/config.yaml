# ============================================================
# WSI-Babel-Shark — Standard Pipeline Configuration (Docker)
# ============================================================
# This configuration is tailored for running inside the Docker
# container. It assumes:
#   - Slides are mounted at:      /slides   (host: G:\wsi_docker_test\slides)
#   - Outputs are mounted at:     /output   (host: G:\wsi_docker_test\output)
#   - Config directory is at:     /config   (host: G:\wsi_docker_test\config)
#   - Repository root is at:      /app      (inside container)
#
# Covered modules:
#   - collect_slides
#   - label_extractor
#   - datamatrix_reader
#   - roi_metadata_extractor
#   - stain_extractor
#   - slide_id_generator
#   - database_manager
# ============================================================


# ------------------------------------------------------------
# 1. Global Pipeline Options
# ------------------------------------------------------------

watch_mode: true                # true = continuously watch 'watch_dir'; false = run once and exit
watch_interval_minutes: 1       # polling interval in minutes when watch_mode is true
log_level: "INFO"               # DEBUG / INFO / WARNING / ERROR

# Import / copy behavior from watch_dir → staging_dir
operation_mode: "copy"          # "copy" = keep originals; "move" = remove from watch_dir after import

# SlideID / renaming behavior
dry_run: false                  # true = simulate without moving/renaming files
timestamp_tag_enabled: true     # true = append _UTC<ScanTime> suffix to SlideID-based filenames

# Allowed WSI extensions to process across modules
wsi_types: [".svs", ".ndpi", ".tif", ".tiff", ".scn", ".mrxs", ".bif", ".png", ".jpg", ".jpeg"]


# ------------------------------------------------------------
# 2. Core Paths (Docker-Friendly)
# ------------------------------------------------------------

# 2.1 Incoming and staging folders for WSIs (Collect Phase)
watch_dir: "/slides"                # Source folder where raw WSIs are mounted from the host
staging_dir: "/output/staging"     # Working directory for the current run

# Single failed folder used by BOTH:
#   - collection/import failures
#   - SlideID failures (invalid/missing metadata)
failed_output_dir: "/output/caseid/failed"

# 2.2 Output folders for SlideID generation (Rename Phase)
final_output_dir: "/output/caseid"        # Destination for successfully renamed WSIs (SlideID-based)

# Optional Excel index of final SlideIDs (human-readable)
final_slide_index_xlsx: "/output/final_slide_ids.xlsx"

# 2.3 SlideID generator block (used by runner to prepare temp_config)
slide_id_generator:
  final_output_dir: "/output/caseid"          # must match top-level final_output_dir
  failed_output_dir: "/output/caseid/failed"  # must match top-level failed_output_dir
  final_slide_index_xlsx: "/output/final_slide_ids.xlsx"

# 2.4 Per-run outputs (Excel, PDF, logs, debug images, etc.)
run_output_dir: "/output"                     # root folder for run-specific output subdirectories
metadata_excel_path: "/output/slide_metadata.xlsx"  # merged Excel registry from slide_id_generator

# 2.5 Label crops / DM input
label_root_dir: "/output/labels"        # root for label crops (runner may create per-run subfolders)

# 2.6 Central SQLite registry
sqlite_db_path: "/output/WSI-Babel-Shark.sqlite"   # SQLite database file
ops_table: "WSI_Babel_Shark_ops"                   # main registry table name (letters/digits/underscores only)


# ------------------------------------------------------------
# 3. DLL / Platform Settings (Windows only, ignored in Docker)
# ------------------------------------------------------------
openslide_dll: ""
  # On Windows host, this would point to libopenslide-*.dll; inside Linux
  # container this is ignored by most modules.


# ------------------------------------------------------------
# 4. Child Script Paths (Used by runner.py inside container)
# ------------------------------------------------------------
# These paths are absolute inside the container, with /app as repo root.

scripts:
  label_extractor: "/app/src/babel_shark/label_extractor.py"
  datamatrix_reader: "/app/src/babel_shark/datamatrix_reader.py"
  roi_metadata_extractor: "/app/src/babel_shark/roi_metadata_extractor.py"
  stain_extractor: "/app/src/babel_shark/stain_extractor.py"
  slide_id_creator: "/app/src/babel_shark/slide_id_generator.py"
  sqlite_table_generator: "/app/src/babel_shark/database_manager.py"


# ------------------------------------------------------------
# 5. Label Extraction & Imaging Parameters
# ------------------------------------------------------------

label_crop_ratio: 0.30           # fraction of width from the left used as the label strip
label_rotation_degrees: -90      # rotation applied to macro/label image prior to cropping

wsi_macro_img_tag: "macro"       # tag/name used to identify macro/label image in multi-image WSIs


# ------------------------------------------------------------
# 6. Stain Dictionaries (Stain Extractor)
# ------------------------------------------------------------

# These JSON dictionaries are baked into the Docker image at /app/config
# and optionally also copied out to /config on container startup.
stain_list_path: "/app/config/stain_list.json"                  # canonical stain names / mappings
stain_replace_map_path: "/app/config/stain_error_replacements.json"   # typo/spelling correction map for stains


# ------------------------------------------------------------
# 7. ROI Metadata Extractor (Fallback Layer)
# ------------------------------------------------------------

roiset_selector:
  layout_model:
    backend: "resnet-open-set"   # layout classifier backend
    model_dir: "/app/model"      # directory containing the trained layout model (inside image)
    params:
      low_conf_gate: 0.90        # below this, layout prediction is considered unreliable
      candidate_min: 0.91        # threshold for taking top candidate as final layout
  roiset_root: "/app/roiset"     # root directory for ROI JSON sets (inside image)
  strict_dynamic: true           # true = only use dynamic model; false = allow looser behavior

# OPTIONAL: Static ROI JSON (single layout)
# ROI_set_file: "/config/roi_layout.json"   # if you want to override with a single fixed ROI layout


# ------------------------------------------------------------
# 8. ROI / Imaging Settings (Shared by ROI & Stain Fallback)
# ------------------------------------------------------------

pxl_offset: 8                       # padding around ROI boxes when cropping labels
roi_pxl_offset: 12                  # padding used by stain_extractor when performing ROI fallback

roi_debug_dir: "/output/roi_debug"           # store ROI overlays, cropped regions, etc.
debug_parts_root: "/output/roi_debug_parts"  # per-part debug images (OCR tiles, etc.)

allowed_labid_letters:
  - "E"
  - "R"
  # Only LabIDs starting with these letters are considered valid when parsing
  # case identifiers from ROI/OCR text. Extend if your lab uses additional letters.


# ------------------------------------------------------------
# 9. OCR Settings (Used by ROI & Stain Extractors)
# ------------------------------------------------------------

ocr_langs: ["en"]                # OCR language list (EasyOCR language codes)
ocr_min_conf: 0.25               # minimum confidence for accepting text boxes
ocr_text_threshold: 0.7          # text probability threshold (EasyOCR)
ocr_ycenter_ths: 0.5             # line alignment threshold (vertical center)
ocr_slope_ths: 0.1               # max allowed line slope when grouping text
ocr_paragraph: false             # true = paragraph-mode, false = word/line mode

save_ocr_inputs: false           # true = save preprocessed OCR input tiles to debug_parts_root


# ------------------------------------------------------------
# 10. OCR Preprocessing (ROI Extractor)
# ------------------------------------------------------------

ocr_preprocess:
  clahe: true                    # apply CLAHE (contrast-limited adaptive histogram equalization)
  clahe_clip: 2.0                # CLAHE clip limit
  clahe_grid: 8                  # CLAHE grid size
  sharpen: true                  # apply image sharpening filter
  sharpen_strength: 1.2          # sharpening intensity multiplier


# ------------------------------------------------------------
# 11. Registration & Reference Images (Advanced / Optional)
# ------------------------------------------------------------

registration:
  enabled: false                 # true = perform feature-based registration
  method: "SIFT"                 # "SIFT" or "ORB"
  sift_nfeatures: 4000           # SIFT number of features
  sift_ratio: 0.75               # SIFT Lowe ratio
  max_features: 2000             # ORB / generic feature cap
  good_match_ratio: 0.25         # proportion of "good matches" required

classifier_strip:
  enabled: false                 # true = use only a vertical strip for layout classification
  side: "left"                   # "left" or "right"
  fraction: 0.32                 # fraction of width

label_strip:
  enabled: false                 # true = use only a strip for OCR (instead of full label)
  side: "left"                   # "left" or "right"
  fraction: 0.32                 # fraction of width

group_ref_image_pattern: "{group}.png"   # template for reference image names, e.g. "A.png"
use_group_ref_image_size: true           # adapt ROI boxes to reference image size
use_group_ref_as_registration: false     # use reference image for geometric registration
resize_to_ref: false                     # resize label to reference size before detection


# ------------------------------------------------------------
# 12. Extraction Rules for OCR Text
# ------------------------------------------------------------

extraction_rules:
  Section:
    allowed_chars: "0123456789"
    replacement_patterns:
      - ["[^0-9]", ""]
      - ["^\\s+|\\s+$", ""]
    default_value: "1"

  Casenumber:
    allowed_chars: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/ "
    replacement_patterns:
      - ["[\\\\/_\\-]", "/"]
      - ["\\s+", " "]
      - ["O", "0"]
      - ["I", "1"]
      - ["l", "1"]
      - ["^\\s+|\\s+$", ""]
    default_value: null

  Pot-BlockID:
    allowed_chars: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 "
    replacement_patterns:
      - ["\\s+", " "]
      - ["[^A-Z0-9 ]", ""]
      - ["^\\s+|\\s+$", ""]
    default_value: null

  Stain:
    replacement_patterns: []
    default_value: null


# ------------------------------------------------------------
# 13. SQLite Normalization (Optional Higher-Level Tables)
# ------------------------------------------------------------

sqlite:
  db_path: "/output/WSI-Babel-Shark.sqlite"
  sqlite_source_table: "slides_raw"
  sqlite_clean_table: "normalized_slides"
  scanner_name_map:
    test: "labtest"


# ------------------------------------------------------------
# 14. Runtime-Injected Keys (Do NOT set manually)
# ------------------------------------------------------------
# These keys are injected at runtime by the runner and must NOT be set here:
#
#   run_timestamp
#   output_run_dir
#   label_crops_dir
#   datamatrix_output_excel
#   stain_output_excel
#   stain_output_pdf
#   datamatrix_failed_folder
#   fallback_failed_folder
#
# ============================================================
# End of Docker config
# ============================================================
