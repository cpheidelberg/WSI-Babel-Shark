# ============================================================
# WSI-Babel-Shark — Standard Pipeline Configuration
# ============================================================
# This configuration file is intended as the "canonical" user-facing
# config for the full Babel-Shark pipeline, covering:
#   - collect_slides
#   - label_extractor
#   - datamatrix_reader
#   - roi_metadata_extractor (ROI fallback)
#   - stain_extractor
#   - slide_id_generator
#   - database_manager
#
# All paths are RELATIVE to the repository root unless explicitly
# stated otherwise.
# ============================================================


# ------------------------------------------------------------
# 1. Global Pipeline Options
# ------------------------------------------------------------

watch_mode: true                # true = continuously watch 'watch_dir'; false = run once and exit
watch_interval_minutes: 1       # polling interval in minutes when watch_mode is true
log_level: "INFO"                # global log level: DEBUG / INFO / WARNING / ERROR

# Import / copy behavior from watch_dir → staging_dir
operation_mode: "copy"           # "copy" = keep original WSIs in watch_dir, "move" = delete after import

# SlideID / renaming behavior (slide_id_generator)
dry_run: false                   # true = simulate without moving/renaming files
timestamp_tag_enabled: true      # true = append _UTC<ScanTime> suffix to SlideID-based filenames

# Allowed WSI extensions to process across modules
wsi_types: [".svs", ".ndpi", ".tif", ".tiff", ".scn", ".mrxs", ".bif", ".png", ".jpg", ".jpeg"]


# ------------------------------------------------------------
# 2. Core Paths (Required)
# ------------------------------------------------------------

# 2.1 Incoming and staging folders for WSIs (Collect Phase)
watch_dir: "./data/test"                 # Source folder where raw WSIs arrive
staging_dir: "./data/staging"            # Working directory for the current run

# Single failed folder used by BOTH:
#   - collection/import failures
#   - SlideID failures (invalid/missing metadata)
failed_output_dir: "./data/caseid/failed"

# 2.2 Output folders for SlideID generation (Rename Phase)
final_output_dir: "./data/caseid"        # Destination for successfully renamed WSIs (SlideID-based)

# Optional Excel index of final SlideIDs (human-readable)
final_slide_index_xlsx: "./output/final_slide_ids.xlsx"

# 2.3 SlideID generator block (used by runner to prepare temp_config)
slide_id_generator:
  final_output_dir: "./data/caseid"          # must match top-level final_output_dir
  failed_output_dir: "./data/caseid/failed"  # must match top-level failed_output_dir
  final_slide_index_xlsx: "./output/final_slide_ids.xlsx"
# 2.4 Per-run outputs (Excel, PDF, logs, debug images, etc.)
run_output_dir: "./output"                    # root folder for run-specific output subdirectories
metadata_excel_path: "./output/slide_metadata.xlsx"  # merged Excel registry from slide_id_generator

# 2.5 Label crops / DM input
label_root_dir: "./data/labels"        # root for label crops (runner will create per-run subfolders)

# 2.6 Central SQLite registry
sqlite_db_path: "./output/WSI-Babel-Shark.sqlite"   # SQLite database file
ops_table: "WSI_Babel_Shark_ops"                    # main registry table name (letters/digits/underscores only)


# ------------------------------------------------------------
# 3. DLL / Platform Settings (Windows only)
# ------------------------------------------------------------
openslide_dll: ""
  # On Windows, this directory must contain libopenslide-*.dll.
  # On Linux/WSL, this key is ignored by most modules.


# ------------------------------------------------------------
# 4. Child Script Paths (Used by runner.py)
# ------------------------------------------------------------
# Adjust ONLY if your repo layout differs.

scripts:
  label_extractor: "./src/babel_shark/label_extractor.py"
  datamatrix_reader: "./src/babel_shark/datamatrix_reader.py"
  roi_metadata_extractor: "./src/babel_shark/roi_metadata_extractor.py"
  stain_extractor: "./src/babel_shark/stain_extractor.py"
  slide_id_creator: "./src/babel_shark/slide_id_generator.py"
  sqlite_table_generator: "./src/babel_shark/database_manager.py"   # optional DB post-processing script


# ------------------------------------------------------------
# 5. Label Extraction & Imaging Parameters
# ------------------------------------------------------------

# How label_extractor should crop labels from WSI/macro images
label_crop_ratio: 0.30           # fraction of width from the left used as the label strip
label_rotation_degrees: -90      # rotation applied to macro/label image prior to cropping

# Tag for associated macro images inside WSIs
wsi_macro_img_tag: "macro"       # used to identify the macro/label-associated image in multi-image WSIs


# ------------------------------------------------------------
# 6. Stain Dictionaries (Stain Extractor)
# ------------------------------------------------------------

# JSON dictionaries for stain normalization and typo replacement
stain_list_path: "./config/stain_list.json"                  # canonical stain names / mappings
stain_replace_map_path: "./config/stain_error_replacements.json"   # typo/spelling correction map for stains


# ------------------------------------------------------------
# 7. ROI Metadata Extractor (Fallback Layer)
# ------------------------------------------------------------
# This block configures the ROI-based fallback used by:
#   - roi_metadata_extractor CLI (standalone ROI extraction)
#   - stain_extractor (when stain is exactly "H&E" and ROI fallback is invoked)

# 7.1 Dynamic ROI selection (DEFAULT, ALWAYS CONFIGURED)
#     The layout model chooses an ROI layout based on label appearance.
roiset_selector:
  layout_model:
    backend: "resnet-open-set"     # layout classifier backend
    model_dir: "./model"           # directory containing the trained layout model
    params:
      # Confidence gates for layout selection.
      # Increase to be more conservative, decrease to accept more layouts.
      low_conf_gate: 0.90          # below this, layout prediction is considered unreliable
      candidate_min: 0.91          # threshold for taking top candidate as final layout
  roiset_root: "./roiset"          # root directory for ROI JSON sets (grouped by layout)
  strict_dynamic: true             # true = only use dynamic model; false = allow looser behavior

# 7.2 OPTIONAL: Static ROI JSON (single layout)
#     Uncomment ONLY if you want to ignore the layout model and always use a single fixed ROI layout.
# ROI_set_file: "./config/roi_layout.json"   # JSON file defining ROI boxes for a single fixed layout


# ------------------------------------------------------------
# 8. ROI / Imaging Settings (Shared by ROI & Stain Fallback)
# ------------------------------------------------------------

# Padding around ROI boxes when cropping images
pxl_offset: 8                       # used by ROI CLI for label ROI extraction
roi_pxl_offset: 12                  # used by stain_extractor when performing ROI fallback

# Debug folders for ROI / OCR visualization
roi_debug_dir: "./output/roi_debug"           # store ROI overlays, cropped regions, etc.
debug_parts_root: "./output/roi_debug_parts"  # per-part debug images (text regions, etc.)

# LabID parsing constraints for ROI-based metadata
allowed_labid_letters:
  - "E"
  - "R"
  # Only LabIDs starting with these letters are considered valid when parsing
  # case identifiers from ROI/OCR text. Extend if your lab uses additional letters.


# ------------------------------------------------------------
# 9. OCR Settings (Used by ROI & Stain Extractors)
# ------------------------------------------------------------

# OCR thresholds and behavior (EasyOCR-based)
ocr_langs: ["en"]                # OCR language list; add more codes if needed
ocr_min_conf: 0.25               # minimum confidence for accepting text boxes
ocr_text_threshold: 0.7          # text probability threshold (EasyOCR)
ocr_ycenter_ths: 0.5             # line alignment threshold (vertical center)
ocr_slope_ths: 0.1               # max allowed line slope when grouping text
ocr_paragraph: false             # true = paragraph-mode, false = word/line mode

# Whether to persist OCR input images for debugging
save_ocr_inputs: false           # true = save preprocessed OCR input tiles to debug_parts_root


# ------------------------------------------------------------
# 10. OCR Preprocessing (ROI Extractor)
# ------------------------------------------------------------

ocr_preprocess:
  clahe: true                    # apply CLAHE (contrast-limited adaptive histogram equalization)
  clahe_clip: 2.0                # CLAHE clip limit
  clahe_grid: 8                  # CLAHE grid size
  sharpen: true                  # apply image sharpening filter
  sharpen_strength: 1.2          # sharpening intensity multiplier


# ------------------------------------------------------------
# 11. Registration & Reference Images (Advanced / Optional)
# ------------------------------------------------------------

# Geometric registration between label and a reference image
registration:
  enabled: false                 # true = perform feature-based registration
  method: "SIFT"                 # "SIFT" or "ORB"
  sift_nfeatures: 4000           # SIFT number of features
  sift_ratio: 0.75               # SIFT Lowe ratio
  max_features: 2000             # ORB / generic feature cap
  good_match_ratio: 0.25         # proportion of "good matches" required

# Classifier strip for layout model
classifier_strip:
  enabled: false                 # true = use only a vertical strip for layout classification
  side: "left"                   # "left" or "right" edge of the image
  fraction: 0.32                 # fraction of width to use as strip

# Label strip cropping for OCR (can be separate from classifier strip)
label_strip:
  enabled: false                 # true = use only a strip for OCR (instead of full label)
  side: "left"                   # "left" or "right"
  fraction: 0.32                 # fraction of width

# Reference images per layout group (used by ROI engine)
group_ref_image_pattern: "{group}.png"   # template for reference image names, e.g. "A.png"
use_group_ref_image_size: true           # true = adapt ROI boxes to reference image size
use_group_ref_as_registration: false     # true = use reference image for geometric registration
resize_to_ref: false                     # true = resize label to reference size before detection


# ------------------------------------------------------------
# 12. Extraction Rules for OCR Text (Advanced / Optional)
# ------------------------------------------------------------
# These rules define how OCR'd text is normalized for:
#   - Section numbers
#   - Case numbers
#   - Pot/BlockID
#   - Stain labels
# If you are happy with current defaults, you can leave them as-is.

extraction_rules:
  Section:
    allowed_chars: "0123456789"
    replacement_patterns:
      - ["[^0-9]", ""]
      - ["^\\s+|\\s+$", ""]
    default_value: "1"

  Casenumber:
    allowed_chars: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/ "
    replacement_patterns:
      - ["[\\\\/_\\-]", "/"]
      - ["\\s+", " "]
      - ["O", "0"]
      - ["I", "1"]
      - ["l", "1"]
      - ["^\\s+|\\s+$", ""]
    default_value: null

  Pot-BlockID:
    allowed_chars: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 "
    replacement_patterns:
      - ["\\s+", " "]
      - ["[^A-Z0-9 ]", ""]
      - ["^\\s+|\\s+$", ""]
    default_value: null

  Stain:
    replacement_patterns: []
    default_value: null


# ------------------------------------------------------------
# 13. SQLite Normalization (Optional Higher-Level Tables)
# ------------------------------------------------------------
# These are for optional secondary tables (raw vs cleaned) if you use
# database_manager / SQLiteTableGenerator for additional normalization.

sqlite:
  db_path: "./output/WSI-Babel-Shark.sqlite"   # mirrors sqlite_db_path
  sqlite_source_table: "slides_raw"            # optional raw table name
  sqlite_clean_table: "normalized_slides"      # optional cleaned/normalized table name
  scanner_name_map:
    test: "labtest"                            # example: map scanner IDs to friendly names


# ------------------------------------------------------------
# 14. Runtime-Injected Keys (Do NOT set manually)
# ------------------------------------------------------------
# NOTE: The runner will automatically inject the following keys into a
# temporary config file passed to each child script. You should NOT define
# them here in the static config:
#
#   run_timestamp            # string tag of the current run, e.g. "2025-11-21_14-30"
#   output_run_dir           # run_output_dir/<run_timestamp>
#   label_crops_dir          # label_root_dir/<date>/<run_timestamp>
#   datamatrix_output_excel  # Excel file with DataMatrix decoding results
#   stain_output_excel       # Excel file with stain detection results
#   stain_output_pdf         # PDF summary report of stain extraction
#   datamatrix_failed_folder # where failed DM images are stored
#   fallback_failed_folder   # where images unresolved after ROI fallback are stored
#
# These keys are mentioned here for completeness, but MUST NOT be
# hard-coded in this static configuration.
# ============================================================
# End of standard config
# ============================================================
