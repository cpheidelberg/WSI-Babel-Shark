# ============================================
# WSI-Babel-Shark — Pipeline Config (Unified)
# ============================================
# All paths are RELATIVE to repo root (./).
# Centralize under `paths/` but expose legacy top-level keys for compatibility.

# ---------- [ PART 0 — General ] ----------
general:
  watch_mode: false
  watch_interval_minutes: 60
  log_level: "DEBUG"

# ---------- [ PART 1 — Centralized Paths ] ----------
paths:
  input:
    watch_dir: &watch_dir "./data/test"
    staging_dir: &staging_dir "./data/allslides"

  output:
    run_output_dir: &run_output_dir "./output"
    failed_output_dir: &failed_output_dir "./data/caseid/failed"
    final_output_dir: &final_output_dir "./data/caseid"
    metadata_csv_path: &metadata_csv "./output/slide_metadata.csv"
    final_slide_index_xlsx: &final_slide_xlsx "./output/final_slide_ids.xlsx"
    sqlite_db_path: &sqlite_db "./output/babbleWSI-Babel-Shark.sqlite"
    roi_debug_dir: &roi_debug_dir ""             # e.g., "./output/roi_debug"
    ocr_debug_parts_root: &ocr_debug_root ""     # e.g., "./output/ocr_debug"

  labels:
    label_root_dir: &label_root "./data/labels"
    label_crops_dir: &label_crops "./data/labels"

  models:
    layout_model_dir: &layout_model_dir "./model"

  roiset:
    roiset_root: &roiset_root "./ROIset"

  config:
    stain_list_path: &stain_list "./config/stain_list.json"
    stain_replace_map_path: &stain_replace "./config/stain_error_replacements.json"
    scanner_map_path: &scanner_map "./config/scanner_map.json"

  scripts:
    label_extractor: &script_label_extractor "./src/babel_shark/label_extractor.py"
    datamatrix_reader: &script_datamatrix_reader "./src/babel_shark/datamatrix_reader.py"
    roi_metadata_extractor: &script_roi_meta "./src/babel_shark/roi_metadata_extractor.py"
    stain_extractor: &script_stain "./src/babel_shark/stain_extractor.py"
    slide_id_creator: &script_slide_id "./src/babel_shark/slide_id_generator.py"
    sqlite_table_generator: &script_sqlite "./src/babel_shark/database_manager.py"

  dlls:
    openslide_dll: &openslide_dll ""   # Windows only; ignored on Linux/WSL

# ---------- [ PART 2 — I/O Bindings (mirrors + legacy exposure) ] ----------
# Modern (grouped) mirrors for internal use:
watch_dir: *watch_dir
staging_dir: *staging_dir
run_output_dir: *run_output_dir
failed_output_dir: *failed_output_dir
final_output_dir: *final_output_dir
metadata_csv_path: *metadata_csv

# Legacy top-level keys expected by runner.py and other modules:
label_root_dir: *label_root
label_crops_dir: *label_crops

# Slide formats — expose legacy keys at top-level
wsi_types: [".svs", ".ndpi", ".png"]
wsi_macro_img_tag: "macro"

# DLL paths (legacy shape)
dll_paths:
  openslide_dll: *openslide_dll

# ---------- [ PART 3 — Components / Scripts ] ----------
scripts:
  label_extractor: *script_label_extractor
  datamatrix_reader: *script_datamatrix_reader
  roi_metadata_extractor: *script_roi_meta
  stain_extractor: *script_stain
  slide_id_creator: *script_slide_id
  sqlite_table_generator: *script_sqlite

slide_id_generator:
  failed_output_dir: *failed_output_dir
  final_slide_index_xlsx: *final_slide_xlsx
  final_output_dir: *final_output_dir

# ---------- [ PART 4 — Data Registry (SQLite) ] ----------
sqlite:
  db_path: *sqlite_db
  sqlite_source_table: "slides_raw"
  sqlite_clean_table: "normalized_slides"
  scanner_name_map:
    test: "labtest"

# Legacy compatibility keys
sqlite_db_path: *sqlite_db
ops_table: "babble_WSI_Babel_Shark_ops"

# ---------- [ PART 5 — Domain Dictionaries / Stains ] ----------
stain_list_path: *stain_list
stain_replace_map_path: *stain_replace
scanner_map_path: *scanner_map

# ---------- [ PART 6 — ROI Layout & Model Selection ] ----------
ROI_set_file: ""     # Leave blank for dynamic selection (legacy key kept)
roiset_selector:
  layout_model:
    backend: "resnet-open-set"
    model_dir: *layout_model_dir
    params:
      crop_left_percent: 1.0
      alpha: 0.60
      beta: 0.20
      gamma: 0.20
      tau: 0.92
      margin: 0.015
      tau_high: 0.98
      fast_accept: 0.955
      top3_gap: 0.03
  roiset_root: *roiset_root
  strict_dynamic: true

# Reference image utilities
group_ref_image_pattern: "{group}.png"
use_group_ref_image_size: true
use_group_ref_as_registration: false
resize_to_ref: true

# ---------- [ PART 7 — OCR Settings ] ----------
# Modern, grouped:
ocr:
  langs: ["en"]
  min_conf: 0.25
  text_threshold: 0.7
  ycenter_ths: 0.5
  slope_ths: 0.1
  paragraph: false
  save_ocr_inputs: false
  debug_parts_root: *ocr_debug_root

# Legacy (flat) — kept for modules expecting these names:
ocr_langs: ["en"]
ocr_min_conf: 0.25
ocr_text_threshold: 0.7
ocr_ycenter_ths: 0.5
ocr_slope_ths: 0.1
ocr_paragraph: false
save_ocr_inputs: false
debug_parts_root: *ocr_debug_root

# ---------- [ PART 8 — Image Registration (optional) ] ----------
registration:
  enabled: false
  method: "SIFT"           # "ORB" or "SIFT"
  reference_image: ""
  sift_nfeatures: 4000
  sift_ratio: 0.75
  max_features: 2000       # For ORB
  good_match_ratio: 0.25   # For ORB

# ---------- [ PART 9 — Optional Strips ] ----------
classifier_strip:
  enabled: false
  side: "left"              # "left" or "right"
  fraction: 0.32

label_strip:
  enabled: false
  side: "left"
  fraction: 0.32

# ---------- [ PART 10 — Extraction / Regex Cleanup ] ----------
extraction_rules:
  Section:
    allowed_chars: "0123456789"
    replacement_patterns:
      - ["[^0-9]", ""]
      - ["^\\s+|\\s+$", ""]
    default_value: "1"

  Casenumber:
    allowed_chars: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/ "
    replacement_patterns:
      - ["[\\\\/_\\-]", "/"]
      - ["\\s+", " "]
      - ["O", "0"]
      - ["I", "1"]
      - ["l", "1"]
      - ["^\\s+|\\s+$", ""]
    default_value: null

  Pot-BlockID:
    allowed_chars: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 "
    replacement_patterns:
      - ["\\s+", " "]
      - ["[^A-Z0-9 ]", ""]
      - ["^\\s+|\\s+$", ""]
    default_value: null

  Stain:
    replacement_patterns: []   # Uses external JSON dictionaries

# ---------- [ PART 11 — Workflow Ops / Imaging ] ----------
# Legacy top-levels expected by code:
operation_mode: "copy"           # "copy" or "move"
roi_pxl_offset: 12               # Padding around ROI boxes (px)
roi_debug_dir: *roi_debug_dir
label_crop_ratio: 0.3            # Fraction of left area to crop for label
label_rotation_degrees: -90

# OCR pre-process (kept flat like original)
ocr_preprocess:
  clahe: true
  clahe_clip: 2.0
  clahe_grid: 8
  sharpen: true
  sharpen_strength: 1.2

# ---------- [ PART 12 — Canonical ROI Logical Names ] ----------
roi_names:
  case: "casenumber"
  potblock: "Pot-blockid"
  section: "section"
  stain: "stain"

# ---------- [ PART 13 — Failed-case Buckets (auto-filled per run) ] ----------
datamatrix_failed_folder: ""
fallback_failed_folder: ""
