[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wsi-babel-shark"
version = "0.1.0"
description = "WSI-Babel-Shark: slide label and metadata extraction pipeline"
requires-python = ">=3.10"

# Core runtime dependencies for all modules:
# - collect, label, dm, extract, stain, slideid, db
# - ROI fallback, OCR engine, layout classifier
dependencies = [
  "numpy",
  "pandas",
  "pyyaml",
  "pillow",
  "openslide-python",
  "opencv-python-headless",
  "pylibdmtx",
  "easyocr",
  "reportlab",
  "tqdm",
  "rapidfuzz",
  "openpyxl",
  "XlsxWriter",
  "torch",
  "torchvision",
  "scikit-learn",
  "matplotlib",
  "seaborn"
]

[project.scripts]
# Main unified CLI entrypoint
babel-shark-cli = "babel_shark.cli:main"

# Layout classifier CLI entrypoints
babel-shark-layout = "babel_shark.layout.layout_cli:main"
layout-cli = "babel_shark.layout.layout_cli:main"

[tool.setuptools]
# Use src/ as the root directory for Python packages
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Pytest configuration
[tool.pytest.ini_options]
markers = [
    "unit: mark fast, isolated unit tests",
    "cli: mark command-line interface tests"
]
