[pytest]
addopts = -q
testpaths = tests
pythonpath = src

markers =
    unit: fast unit tests for core logic
    cli: command-line smoke tests
    integration: multi-module integration tests

filterwarnings =
    ignore:distutils Version classes are deprecated:DeprecationWarning:pylibdmtx.wrapper
    ignore::DeprecationWarning:pylibdmtx\.wrapper
